site_name: ok-nte
site_description: Documentation for the ok-nte Neverness To Everness automation tool
site_url: https://bnanz0.github.io/ok-nte/
repo_url: https://github.com/BnanZ0/ok-nte
repo_name: BnanZ0/ok-nte
edit_uri: edit/main/docs/

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - content.action.edit
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - English:
      - Home: en/index.md
      - Getting started:
          - Installation: en/getting-started/installation.md
          - Before you start: en/getting-started/configuration.md
      - Features:
          - Overview: en/features/overview.md
          - Quick start: en/guides/quick-start.md
          - FAQ and feedback: en/guides/troubleshooting.md
  - 简体中文:
      - 首页: zh-CN/index.md
      - 开始使用:
          - 安装: zh-CN/getting-started/installation.md
          - 使用前配置: zh-CN/getting-started/configuration.md
      - 功能:
          - 功能概览: zh-CN/features/overview.md
          - 快速上手: zh-CN/guides/quick-start.md
          - 常见问题与反馈: zh-CN/guides/troubleshooting.md
  - Development:
      - Contributing: development/contributing.md
      - Running from source: development/running-from-source.md
      - SceneFlow author guide: development/scene_flow.md
      - Combat Planner guide: development/combat-planner.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

exclude_docs: |
  README.md

plugins:
  - search

strict: true
